<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mokemon</title>
</head>
<body>
    <h1>Mokemon 🔥💧🌱</h1>

    <section id="selection-mokemon">     
        <h2>selecciona mokemon</h2>
        
        <label for="hipodoge">Hipodoge</label>
        <input type="radio" name="mascota" id="hipodoge">
        
        <label for="capipepo">Capipepo</label>
        <input type="radio" name="mascota" id="capipepo">
        
        <label for="ratigueya">Ratigueya</label>
        <input type="radio" name="mascota" id="ratigueya">

        <button id="boton-mascota">SELECCIONAR mokemon</button>

    </section>

    <section id="selection-atack">

 <h2>Elige tu ataque:</h2>
            <p>Tu mascota <span id="mokemonJugador"> </span> tiene <span>3</span> vidas</p>
            <p>Las mascota <span id="mokemonEnemigo"></span> del enemigo tiene <span>3</span> vidas</p>

            <p>
                <button id="boton-fuego">Fuego 🔥</button>
                <button id="boton-agua">Agua 💧</button>
                <button id="boton-tierra">Tierra 🌱</button>
            </p>
    </section>

    <section id="mensaje">
        <p>Tu mascota atacó con <span id="ataque-jugador"></span>, las mascota del enemigo atacó con <span id="ataque-enemigo"></span> - GANASTE 🎉</p>
    </section>
    
    <section>
        <button id="reiniciar">REINICIAR</button>

    </section>

    <script src="./js/pokemon.js"></script>
</body>
</html>

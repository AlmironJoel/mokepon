<html lang="en">
    <!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mokepon</title>
    <link rel="stylesheet"  href="./style.css">
</head>
<body>
    <section class="titulo">
        <h1>Battler Mokepon</h1>
    </section>
    
    <section id="selection-mokemon">     
        <h2>Selecciona mokepon</h2>

        <div id="tarjetas-mokepones" class="cards"></div><!-- renderizado tarjetas -->

        <button class="button-select-mokepon" id="boton-mascota">SELECCIONAR mokemon</button>
    </section>

    <section id="seccion-mapa">
        <canvas id="mapa"></canvas>
        <div class="botones-movimiento">
            <button id="boton-derecha">derecha</button>
            <button id="boton-izquierda">izquierda</button>
            <button id="boton-arriba">arriba</button>
            <button id="boton-abajo">abajo</button>
        </div>
    </section>

    <section id="selection-atack">
    <h2>Elige tu ataque:</h2>
    
        <div id="botones-de-ataque" class="botones"><!--botones -->
        </div>

        <div class="notificaciones">
            <p id="resultado">
                Muchas suerte!
            </p>
            <div>
                <button class="boton-reinicio" id="reiniciar">REINICIAR</button>
            </div>
        </div>

        <div class="ataques"><!-- contenedor vidas,mascota y ataque -->
            <div class="contenido-ataques">
                <h2>Jugador</h2>
                <p class="mokemonJugador" id="mokemonJugador"></p>
                <p class="vidas" id="vidasJugador"></p>
                <div class="ataqueJugador" id="ataque-jugador"></div>
            </div>

            <div class="contenido-ataques">
                    <h2>Resultados</h2>
                    <p>Ganada ✅ Perdida❎ empate⭕</p>
                    <div class="resultado-rondas" id="resultado-pelea"></div>
            </div>

            <div class="contenido-ataques">
                <h2>PC</h2>
                <p id="mokemonEnemigo"></p>
                <p class="vidas" id="victoriasEnemigo"></p>
                <div id="ataque-enemigo"></div>
            </div>
        </div><!-- contenedor vidas,mascota y ataque -->
    </section>

    <script src="./js/pokemon.js"></script>
</body>
</html>

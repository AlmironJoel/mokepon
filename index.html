<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mokemon</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <section class="titulo">
        <h1>Mokemon 🔥💧🌱</h1>
    </section>
    
    <section id="selection-mokemon">     
        <h2>Selecciona mokemon</h2>
        
        <label class="card-mokepon" for="hipodoge">Hipodoge</label>
        <input type="radio" name="mascota" id="hipodoge">
        
        <label class="card-mokepon" for="capipepo">Capipepo</label>
        <input type="radio" name="mascota" id="capipepo">
        
        <label class="card-mokepon" for="ratigueya">Ratigueya</label>
        <input type="radio" name="mascota" id="ratigueya">

        <button class="button-select-mokepon" id="boton-mascota">SELECCIONAR mokemon</button>

    </section>

    <section id="selection-atack">

 <h2>Elige tu ataque:</h2>
        <p>Tu mascota <span id="mokemonJugador"> </span> tiene <span id="vidasJugador"></span> vidas</p>
        <p>Las mascota <span id="mokemonEnemigo"></span> del enemigo tiene <span id="vidasEnemigo"></span> vidas</p>
        <section>
            <button id="boton-fuego">Fuego 🔥</button>
            <button id="boton-agua">Agua 💧</button>
            <button id="boton-tierra">Tierra 🌱</button>
        </section>
    </section>

    <section id="mensaje">

    </section>
    
    <section>
        <button id="reiniciar">REINICIAR</button>
    </section>

    <script src="./js/pokemon.js"></script>
</body>
</html>
